[project]
name = "serve"
version = "0.1.0"
description = ""
authors = [{ name = "datvodinh", email = "vodinhdat03@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.119.1",
    "ray[default,llm,serve]>=2.50.1",
    "vllm>=0.11.0",
]

[dependency-groups]
dev = [
    "deptry>=0.19.1,<0.20",
    "ruff>=0.6.1,<0.7",
]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
include = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
